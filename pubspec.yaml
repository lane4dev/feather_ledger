name: feather_ledger
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Persistence (DB)
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Persistence (Settings)
  shared_preferences: ^2.3.5

  # Navigation
  go_router: ^14.7.1

  # UI/Charts
  fl_chart: ^1.1.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  rrule: ^0.2.18
  uuid: ^4.5.2
  clock: ^1.1.2
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1

  # Data portability (spec 004, US3/US4): CSV export and the backup archive
  # move bytes across the app boundary, which is the deliverable itself.
  # No separate cross_file dependency: share_plus and file_selector both
  # re-export the same XFile, so it is never imported from its own package.
  archive: ^4.3.0
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.34.6
  json_serializable: ^6.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/app_logo.png
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    image_path: assets/images/app_logo.png
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: assets/images/app_logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_logo.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
