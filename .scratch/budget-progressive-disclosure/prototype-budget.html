<style>

[data-variant=B] .group.budgeted{display:grid;gap:7px;background:none;border:0;padding:0}[data-variant=B] .budgeted .cat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 12px}[data-variant=B] .cat .bar{grid-column:1 / -1}[data-variant=B] .metrics>div+div{border-inline-start:1px solid var(--line);padding-inline-start:9px}[data-variant=B] .hero{border-radius:15px}

.panel{padding:14px;margin:10px 0}.panel .metrics{margin:8px 0}.subhead{font-weight:650;margin:10px 0 4px}.hint{font-size:12px;color:var(--muted);margin:8px 0}.monthlabel{color:var(--muted);font-size:13px;margin:6px 1px}.rankcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.rankcols>div+div{border-inline-start:1px solid var(--line);padding-inline-start:12px}.rankcols button,.txrow,.pickrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.txrow:last-child,.pickrow:last-child,.rankcols button:last-child{border:0}.txrow span:last-child{white-space:nowrap}.rankcols button span{overflow-wrap:anywhere}.rankcols h3{font-size:13px;margin:9px 0}.chart{width:100%;display:block;margin-top:8px}.legend{display:flex;gap:12px;color:var(--muted);font-size:11px}.legend i{display:inline-block;width:10px;height:7px;background:var(--main);margin-right:4px;border-radius:2px}.legend i.line{height:0;border-top:2px dashed var(--pending);background:none;vertical-align:middle}.legend i.dot{width:5px;height:5px;border-radius:50%;background:var(--warn)}textarea,input,select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px}textarea{resize:vertical;min-height:64px}.field{display:block;font-size:13px;margin:14px 0}.field input,.field textarea,.field select{margin-top:5px}.primary,.pill{font-size:13px;font-weight:650;padding:8px 14px;border-radius:16px}.primary{background:var(--main);color:var(--card)}.pill{background:var(--soft);color:var(--main)}.overlay{position:absolute;inset:0;background:#06140e57;display:flex;align-items:flex-end;z-index:3}.sheet{background:var(--paper);width:100%;max-height:90%;display:flex;flex-direction:column;border-radius:24px 24px 0 0;box-shadow:0 -6px 25px #0001;animation:rise .2s}.sheet::before{content:"";display:block;width:34px;height:4px;flex:none;background:var(--line);margin:9px auto 0;border-radius:5px}.sheetheader{padding:4px 15px}.sheetheader h2{font-size:18px;margin:0}.sheetbody{overflow:auto;padding:0 15px 28px;min-height:0}.compose{display:flex;height:9px;border-radius:10px;overflow:hidden;background:var(--line);margin:10px 0}.note{margin-top:8px}.sheetsub{font-size:12px;margin:0 0 6px;color:var(--muted)}.toast{position:absolute;z-index:5;bottom:64px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:20px;background:var(--chrome);color:var(--paper);font-size:13px;pointer-events:none}

@media(max-width:355px){[data-variant=C] .budgeted .cat>.progress{grid-column:2}}
.category-actions{position:relative;flex:none}.category-actions summary{list-style:none;cursor:pointer}.category-actions summary::-webkit-details-marker{display:none}.category-actions summary:focus-visible{outline:3px solid var(--main)}
.action-list{position:absolute;inset-inline-end:0;top:100%;min-width:120px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px #0002;z-index:2}.action-list button{display:block;width:100%;padding:9px 14px;border-radius:8px}.action-list button:hover:enabled{background:var(--surface)}.action-list button:disabled{color:var(--muted)}.danger{background:var(--bad);color:var(--card)}

<body><div class="stage"><aside class="desk"><div class="brand" id="brand"></div><h1>预算页原型</h1><div id="desktopControls"></div><div class="readout" id="state"></div></aside><main class="phone" id="phone"><header class="toolbar" id="top"></header><div class="content" id="content"></div><nav id="nav" class="appnav" aria-label="应用导航示意"></nav><div id="layer"></div></main></div><nav class="switcher" id="switcher" aria-label="原型方案切换"></nav>
<script>

'use strict';
const $=id=>document.getElementById(id);
const url=new URL(location.href);
const TODAY=2026*12+10, DAY=25;
const variants={A:'分组清单',B:'独立卡片',C:'紧凑账表'};
const localVariant=new URLSearchParams(url.hash.split('?')[1]).get('variant');
const selectedVariant=localVariant||url.searchParams.get('variant');
const config={
  variant:Object.hasOwn(variants,selectedVariant)?selectedVariant:'A',
  dark:matchMedia('(prefers-color-scheme: dark)').matches, scenario:'regular', language:'zh-Hans'
};
const home=month=>({page:'home',month,sheets:[]});
let route=home(TODAY), drafts={}, notes={}, caps=[], events=new Map(), scrolls=new Map(), toastTimer;
const names=['餐饮','交通','日用','文娱','医疗','旅行','学习','旧会员'];
const icons=['utensils','train','bag','ticket','cross','plane','book','ticket'];
const colors=['#bc634c','#447cad','#3f916b','#9770a9','#af6e3e','#4d8795','#7d8360','#8c8194'];
const initialCaps=[120000,40000,70000,30000,null,null,null,9000];
const previousActual=[135000,28600,46200,3000,9600,0,0,4500], currentActual=[68400,14200,23800,12000,15600,0,0,0];
const currentFixed=[0,8000,6800,0,0,0,0,0], currentPending=[12000,0,5200,0,0,6000,0,0];
const nextPending=[18000,8000,6000,0,0,2000,0,0];
const sampleTitles=[['晚餐','午餐','早餐'],['地铁充值','通勤车费','打车'],['超市采购','家庭用品','清洁用品'],['演出票','电影票','音乐会'],['门诊费用','药品','护理用品'],['周末车票','旅途餐费','行李寄存'],['书籍','课程','文具'],['会员订阅','演出票','电影票']];
const fixedTitles=['餐食预订','通勤月票','生活订购','会员订阅','定期护理','旅行预订','课程订阅','会员订阅'];
const paths={
 book:'M4 3h12a2 2 0 0 1 2 2v15H6a2 2 0 0 1-2-2z M4 17h14',wallet:'M20 8H5a2 2 0 0 1 0-4l12-2v6 M4 7v12a2 2 0 0 0 2 2h14V8 M20 12h-5v5h5',more:'M5 12h.01 M12 12h.01 M19 12h.01',leaf:'M20 3c-6 0-14 1-14 9a5 5 0 0 0 5 5c7 0 9-8 9-14z M4 21 16 8',left:'m14 6-6 6 6 6',right:'m10 6 6 6-6 6',down:'m6 9 6 6 6-6',plus:'M12 5v14 M5 12h14',back:'m12 5-7 7 7 7 M5 12h15',close:'m6 6 12 12 M18 6 6 18',chart:'M4 19V5 M4 19h16 M9 16v-4 M14 16V6 M19 16V9',tools:'M4 7h5 M13 7h7 M4 17h9 M17 17h3 M9 4v6 M16 14v6',utensils:'M5 3v6a3 3 0 0 0 6 0V3 M8 3v18 M18 3c-3 1-4 6-4 10h4 M18 3v18',train:'M7 4h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M5 11h14 M8 15h.01 M16 15h.01 M8 18l-3 3 M16 18l3 3',bag:'M4 8h16l-1 13H5L4 8z M8 9V6a4 4 0 0 1 8 0v3',ticket:'M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z M15 8v2 M15 14v2',cross:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',plane:'m22 2-7 20-4-8-8-4z M11 14 22 2',calendar:'M3 6h18v15H3z M3 10h18 M7 3v5 M17 3v5',check:'m4 12 5 5L20 6'
};
function icon(key){return `<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[key]}"/></svg>`}
function safe(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v,decimals=false){return `${v<0?'− ':''}¥${(Math.abs(v)/100).toLocaleString('zh-CN',{minimumFractionDigits:decimals?2:0,maximumFractionDigits:2})}`}
const monthLabel=m=>`${Math.floor(m/12)}年${m%12+1}月`;
const monthShort=m=>`${m%12+1}月`;
const mode=()=>route.month<TODAY?'review':route.month>TODAY?'plan':'track';
const sum=(rows,field)=>rows.reduce((v,r)=>v+r[field],0);
const percent=(n,d)=>d?`${Math.round(100*n/d)}%`:'—';
function capAt(id,m){
  if(id===7&&m>=TODAY)return null;
  const rule=caps.findLast(r=>r.scenario===config.scenario&&r.id===id&&r.from<=m&&(r.to===null||m<=r.to));
  if(rule)return rule.cap;
  if(config.scenario==='blank'||(config.scenario==='new'&&m<TODAY))return null;
  return initialCaps[id];
}
function txs(id,m){
  const key=`${config.scenario}:${id}:${m}`;
  if(events.has(key))return events.get(key);
  const delta=m-TODAY;
  let act=delta>0?0:delta===0?currentActual[id]:delta===-1?previousActual[id]:
    Math.round((id===3?3000:currentActual[id])*(id===3?1:[.82,.93,1.13,1.07,.99,.90][m%6]));
  if(config.scenario==='new'&&delta<0)act=0;
  const fixed=Math.min(act,currentFixed[id]);
  const pending=delta===0?currentPending[id]:delta>0?nextPending[id]:0;
  const entries=[];
  function add(title,amount,kind,day){if(amount>0)entries.push({title,amount,kind,day})}
  add(fixedTitles[id],fixed,'fixed',3);
  const flex=act-fixed,first=Math.round(flex*.51),second=Math.round(flex*.29);
  add(sampleTitles[id][0],first,'flex',21);
  add(sampleTitles[id][1],second,'flex',15);
  add(sampleTitles[id][2],flex-first-second,'flex',8);
  add(`${fixedTitles[id]}账单`,pending,'pending',28);
  events.set(key,entries);
  return entries;
}
const actualOf=(id,m)=>txs(id,m).reduce((a,x)=>a+(x.kind==='pending'?0:x.amount),0);
function rows(m){
  const list=names.map((name,id)=>{
    const entries=txs(id,m),actual=actualOf(id,m),cap=capAt(id,m);
    const pending=m<TODAY?0:sum(entries.filter(t=>t.kind==='pending'),'amount');
    const fixed=sum(entries.filter(t=>t.kind==='fixed'),'amount');
    const history=[m-3,m-2,m-1].filter(n=>n<=TODAY&&(config.scenario!=='new'||n>=TODAY));
    const avg=history.length?Math.round(history.reduce((v,n)=>v+actualOf(id,n),0)/history.length):null;
    return {name,id,archived:id===7,cap,actual,pending,fixed,flex:actual-fixed,baseline:fixed+pending,avg,
      remaining:cap===null?null:cap-actual-pending,variance:cap===null?null:cap-actual,entries};
  });
  const all=sum(list,'actual');
  for(const r of list)r.anomaly=r.avg>0&&r.actual>=1.25*r.avg&&((all&&r.actual/all>=.05)||(r.cap!==null&&r.actual>r.cap));
  return list;
}
function summary(){
  const all=rows(route.month),set=all.filter(r=>r.cap!==null);
  const severity=r=>r.actual>r.cap?2:r.actual+r.pending>r.cap?1:0;
  set.sort((a,b)=>mode()==='review'?a.variance-b.variance:
    severity(b)-severity(a)||(b.actual+b.pending)/b.cap-(a.actual+a.pending)/a.cap||a.id-b.id);
  const un=all.filter(r=>r.cap===null&&(r.actual||r.pending)).sort((a,b)=>b.actual+b.pending-a.actual-a.pending);
  return {all,set,un,cap:sum(set,'cap'),actual:sum(set,'actual'),pending:sum(set,'pending'),baseline:sum(set,'baseline')};
}
const noteKey=id=>`${config.scenario}/${route.month}/${id??'month'}`;
function note(id){
  const key=noteKey(id);
  return notes[key]??(route.month===TODAY-1&&config.scenario==='regular'&&id==null?'下月减少外食。':'');
}
function bar(actual,pending,cap,marker=false,hatch=false){
  const a=cap?Math.min(100,100*actual/cap):0,b=cap?Math.min(100-a,100*pending/cap):0;
  return `<div class="progress" aria-label="${safe(hatch?'固定基线占比 '+percent(pending,cap):'实际 '+percent(actual,cap)+'，待入账 '+percent(pending,cap))}"><div class="bar"><span class="actual" style="width:${a}%"></span><span class="${hatch?'hatch':'pending'}" style="width:${b}%"></span></div>${marker?`<i class="tick" title="今天 · 11月25日" style="left:${(DAY-1)/29*100}%"></i>`:''}</div>`;
}
function initials(r){return `<span class="circle" style="--tone:${colors[r.id]}">${icon(icons[r.id])}</span>`}
const metric=(label,value)=>`<div class="metric"><small>${label}</small><strong>${value}</strong></div>`;
const head=(title,right='')=>`<div class="sectionhead"><h2>${title}</h2><small>${right}</small></div>`;
function hero(s){
  const md=mode(),plan=md==='plan',review=md==='review',v=s.cap-(plan?s.baseline:s.actual+(review?0:s.pending));
  const label=plan?'可自由支配':review?(v<0?'本月超支':'本月结余'):(v<0?'本月预计超支':'本月预计剩余');
  const [whole,fraction]=money(Math.abs(v),true).slice(1).split('.');
  const parts=plan?[['固定基线',money(s.baseline)],['基线占比',percent(s.baseline,s.cap)]]:review?[['已消费',money(s.actual)],['预算使用率',percent(s.actual,s.cap)]]:[['已消费',money(s.actual)],['待入账',money(s.pending)]];
  return `<section class="hero ${md}"><div class="herohead">${label}<span class="badges">${md==='track'?'':`<span class="badge">${plan?'规划':'复盘'}</span>`}${s.set.length?`<span class="badge">达标 ${s.set.filter(r=>r.actual<=r.cap).length}/${s.set.length}</span>`:''}</span></div><div class="heroamount ${v<0?'neg':''}">${s.set.length?`<small>${plan&&v<0?'− ':''}¥</small><b>${whole}</b><em>.${fraction}</em>`:'<b>—</b>'}</div>${bar(plan?0:s.actual,plan?s.baseline:review?0:s.pending,s.cap,md==='track',plan)}<div class="metrics">${[...parts,['总预算',money(s.cap)]].map(x=>metric(...x)).join('')}</div></section>`;
}
function category(r){
  const md=mode(),plan=md==='plan',review=md==='review',rem=review?r.variance:r.remaining;
  const sub=plan?[`固定基线 ${money(r.baseline)}`,r.avg===null?'':`近3月均值 ${money(r.avg)}`].filter(Boolean).join(' · '):
    review?`${r.variance<0?'超支':'节余'} ${money(Math.abs(r.variance))}`:
    r.pending?`含待入账 ${money(r.pending)}`:`已用 ${percent(r.actual,r.cap)}`;
  return `<button class="cat" data-act="${plan?'edit':'detail'}" data-id="${r.id}">${initials(r)}<span class="mid"><strong>${r.name}</strong>${r.anomaly?'<i class="signal" aria-label="异常波动"></i>':''}<span class="sub">${sub}</span></span><span class="right"><strong class="${!plan&&rem<0?'neg':''}">${plan?'预算':rem<0?'超支':'剩余'} ${money(plan?r.cap:Math.abs(rem))}</strong>${!plan?`<span class="sub">${money(r.actual)} / ${money(r.cap)}</span>`:''}</span>${!plan||r.baseline?bar(plan?0:r.actual,plan?r.baseline:r.pending,r.cap,false,plan):''}</button>`;
}
function unplanned(s){
  if(!s.un.length)return '';
  const total=sum(s.all,'actual');
  return head('计划外支出','本月 '+money(sum(s.un,'actual'),true))+`<div class="group">${s.un.map(r=>`<div class="unrow">${initials(r)}<button class="mid" data-act="${mode()==='plan'?'edit':'detail'}" data-id="${r.id}"><strong>${r.name}</strong><span class="sub">${r.actual&&r.actual/total>=.05?'占本月总支出 '+percent(r.actual,total):''}${r.pending?`${r.actual?' · ':''}待入账 ${money(r.pending)}`:''}</span></button><span class="right"><strong>${money(r.actual||r.pending)}</strong>${r.archived?'<small class="muted">已归档</small>':`<button class="link" data-act="edit" data-id="${r.id}">设预算</button>`}</span></div>`).join('')}</div>`;
}
function attribution(s){
  return [s.set.filter(r=>r.variance<0).sort((a,b)=>a.variance-b.variance).slice(0,3),
    s.set.filter(r=>r.variance>=0).sort((a,b)=>b.variance-a.variance).slice(0,3)];
}
function entry(s){
  let subtitle=`固定 ${money(sum(s.all,'fixed'))} · 弹性 ${money(sum(s.all,'flex'))}`;
  if(mode()==='review'){
    const [over,under]=attribution(s),r=over[0]||under[0],n=note();
    subtitle=[r?`${r.name}${r.variance<0?'超支':'结余'} ${money(Math.abs(r.variance))}`:'',n?(Array.from(n).length<10?n:'已写复盘备忘'):''].filter(Boolean).join(' · ')||'查看本月复盘';
  }
  return `<button class="entry" data-act="review">${icon('chart')}<span class="copy"><strong>月度复盘与趋势</strong><small class="secondary">${safe(subtitle)}</small></span>${icon('right')}</button>`;
}
function homePage(s){
  const md=mode();
  return hero(s)+(md==='review'?entry(s):'')+head('已设预算分类',`${s.set.length} 项`)+(s.set.length?
    `<div class="group budgeted">${config.variant==='C'?'<div class="tablehead"><span>分类</span><span>额度与进度</span></div>':''}${s.set.map(category).join('')}</div>`:
    '<div class="panel">还没有分类预算。<button class="link" data-act="pick">设置首个预算</button></div>')+unplanned(s)+
    (md==='track'?entry(s):md==='plan'?`<div class="planhint">${icon('calendar')} 已排期固定账单 ${money(sum(s.all,'baseline'))} · 仅含已生成账单</div>`:'');
}

function chart(id){
  const points=Array.from({length:6},(_,i)=>{
    const m=route.month-5+i,ids=id==null?names.map((_,n)=>n):[id],values=ids.map(n=>capAt(n,m)).filter(n=>n!==null);
    const cap=values.length?values.reduce((a,b)=>a+b,0):null;
    const actual=ids.reduce((a,n)=>a+actualOf(n,m),0),key=`${config.scenario}/${m}/${id??'month'}`;
    const flagged=Boolean(notes[key]??(config.scenario==='regular'&&m===TODAY-1&&id==null));
    return {m,cap,actual,flagged};
  });
  if(points.filter(p=>p.m<=TODAY&&(p.cap!==null||p.actual>0)).length<2)return '';
  const hi=Math.max(1,...points.flatMap(p=>[p.cap||0,p.actual])),x=i=>36+i*48,y=v=>98-v/hi*76;
  let prev=false;
  const line=points.map((p,i)=>{
    if(p.cap===null){prev=false;return ''}
    const part=`${prev?'L':'M'}${x(i)},${y(p.cap)}`;prev=true;return part;
  }).join(' ');
  const avg=id==null?null:rows(route.month)[id].avg;
  return `<section class="panel"><h2>近 6 个月趋势</h2><svg class="chart" viewBox="0 0 312 126" role="img" aria-label="六个月实际支出与预算趋势">${[24,60,98].map(v=>`<path d="M12 ${v}H301" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}${points.map((p,i)=>`<g><title>${monthLabel(p.m)} · 实际 ${money(p.actual)} · 预算 ${p.cap===null?'—':money(p.cap)}</title><rect x="${x(i)-9}" y="${y(p.actual)}" width="18" height="${98-y(p.actual)}" rx="3" fill="var(--main)"/><text x="${x(i)}" y="115" fill="var(--muted)" text-anchor="middle" font-size="10">${monthShort(p.m)}</text>${p.flagged?`<circle cx="${x(i)}" cy="122" r="2" fill="var(--warn)"/>`:''}</g>`).join('')}<path d="${line}" fill="none" stroke="var(--pending)" stroke-width="2.3" stroke-dasharray="5 3"/>${avg&&avg<=hi?`<path d="M12 ${y(avg)}H301" stroke="var(--muted)" stroke-dasharray="1 4"/>`:''}</svg><div class="legend"><span><i></i>实际</span><span><i class="line"></i>预算</span>${points.some(p=>p.flagged)?'<span><i class="dot"></i>备忘</span>':''}${avg?'<span>点线 · 近3月均值</span>':''}</div></section>`;
}
function noteBox(id){
  if(id===7)return '<section class="panel"><h2>分类复盘备忘</h2><p class="hint">归档分类 · 只读</p><p>会员已到期。</p></section>';
  const k=noteKey(id),text=drafts[k]??note(id),title=id==null?'月度复盘备忘':'分类复盘备忘';
  return `<section class="panel note"><h2>${title}</h2><label class="field"><textarea aria-label="${title}" data-note="${k}" placeholder="记下本月想保留的观察">${safe(text)}</textarea></label><div class="between"><small class="muted" data-count>${Array.from(text).length} / 500</small><button class="pill" data-act="save-note" ${Array.from(text).length>500?'disabled':''}>保存备忘</button></div></section>`;
}
function reviewPage(s){
  const [over,under]=attribution(s);
  const ranks=(title,list)=>`<div><h3>${title}</h3>${list.length?list.map(r=>`<button data-act="detail" data-id="${r.id}"><span>${r.name}</span><strong class="${r.variance<0?'neg':''}">${money(Math.abs(r.variance))}</strong></button>`).join(''):'<small class="muted">暂无</small>'}</div>`;
  return `<p class="monthlabel">${monthLabel(route.month)} · CNY</p><section class="panel"><h2>整月支出构成</h2><div class="metrics">${metric('固定实耗',money(sum(s.all,'fixed')))}${metric('弹性实耗',money(sum(s.all,'flex')))}${metric('固定基线',money(sum(s.all,'baseline')))}</div><p class="hint">固定基线包含固定实耗与有效待入账。</p>${config.scenario==='regular'&&route.month===TODAY-1?'<p class="hint">上月有遗留待入账账单，结余只计实际支出。</p>':''}</section><section class="panel"><h2>分类归因</h2><div class="rankcols">${ranks('超支 TOP 3',over)}${ranks('结余 TOP 3',under)}</div></section>${chart()}${noteBox()}`;
}
function transactions(r,all=false){
  const order=r.entries.map((t,index)=>({...t,index})).sort((a,b)=>b.amount-a.amount||b.day-a.day);
  if(!order.length)return '<p class="hint">本月暂无贡献流水</p>';
  return (all?order:order.slice(0,3)).map(t=>`<button class="txrow" data-act="transaction" data-id="${r.id}" data-index="${t.index}"><span><strong>${safe(t.title)}</strong><small class="secondary">${monthShort(route.month)}${t.day}日 · ${t.kind==='pending'?'待入账':t.kind==='fixed'?'固定实耗':'弹性实耗'}</small></span><span>${money(t.amount)} ${icon('right')}</span></button>`).join('')+
  (!all&&order.length>3?`<button class="link" data-act="all-tx" data-id="${r.id}">查看全部 ${order.length} 笔</button>`:'');
}
function categoryActions(r){
  if(r.archived)return '';
  return `<details class="category-actions"><summary class="icbtn" aria-label="分类预算操作" title="分类预算操作">${icon('more')}</summary><div class="action-list"><button data-act="edit" data-id="${r.id}">编辑</button><button class="neg" data-act="delete-budget" data-id="${r.id}" ${r.cap===null?'disabled':''}>删除</button></div></details>`;
}
function categoryPage(r){
  const total=r.actual+r.pending;
  return `<div class="between"><p class="monthlabel">${monthLabel(route.month)} · CNY</p>${r.archived?'<span class="badge">已归档</span>':''}</div><section class="panel"><div class="between"><strong>${r.cap===null?'未设预算':(r.remaining<0?'超支 ':'剩余 ')+money(Math.abs(r.remaining))}</strong><small class="muted">${money(r.actual)} / ${r.cap===null?'—':money(r.cap)}</small></div>${bar(r.actual,r.pending,r.cap)}${r.anomaly?`<p class="hint"><i class="signal"></i> 较近3月均值 +${Math.round(100*(r.actual-r.avg)/r.avg)}%</p>`:''}</section><section class="panel"><h2>支出构成</h2><div class="compose">${[['fixed','var(--main)'],['flex','var(--muted)'],['pending','var(--pending)']].map(([p,col])=>`<i style="width:${total?100*r[p]/total:0}%;background:${col}"></i>`).join('')}</div><div class="metrics">${metric('固定实耗',money(r.fixed))}${metric('弹性实耗',money(r.flex))}${mode()==='review'?'':metric('待入账',money(r.pending))}</div><p class="hint">固定基线 ${money(r.baseline)}${r.avg===null?'':` · 上月实际 ${money(actualOf(r.id,route.month-1))} · 近3月均值 ${money(r.avg)}`}</p></section>${chart(r.id)}<section class="panel"><h2>贡献流水 TOP 3</h2>${transactions(r)}</section>${noteBox(r.id)}`;
}
function edit(r){
  return `<p class="monthlabel">${monthLabel(route.month)} · ${r.name}</p><form id="budgetForm" data-id="${r.id}"><label class="field">预算金额（¥）<input name="amount" type="number" step=".01" min=".01" required value="${r.cap===null?'':r.cap/100}"></label><div class="segments">${[['固定基线',r.baseline],['近3月均值',r.avg]].filter(x=>x[1]>0).map(([l,v])=>`<button type="button" data-act="fill" data-value="${v/100}">${l} ${money(v)}</button>`).join('')}</div><label class="field">生效范围<select name="scope"><option value="single">仅本月</option><option value="future">本月及以后</option></select></label>${mode()==='review'?'<p class="hint">保存将修改该历史月份的预算。</p>':''}<div class="between">${r.cap!==null?`<button type="button" class="link neg" data-act="clear" data-id="${r.id}">移除预算</button>`:'<span></span>'}<button class="primary">保存预算</button></div></form>`;
}
function ctl(){
  const buttons=(title,list)=>`<fieldset><legend>${title}</legend><div class="segments">${list.map(([key,label,on])=>`<button data-act="${key}" aria-pressed="${on}">${label}</button>`).join('')}</div></fieldset>`;
  return buttons('查看月份',[['past','过去',mode()==='review'],['today','当月',mode()==='track'],['future','未来',mode()==='plan']])+buttons('外观',[['light','浅色',!config.dark],['dark','深色',config.dark]])+buttons('样例账本',[['regular','日常',config.scenario==='regular'],['new','首月',config.scenario==='new'],['blank','未设预算',config.scenario==='blank']])+buttons('App 语言',[['zh-Hans','简体',config.language==='zh-Hans'],['zh-Hant','繁體',config.language==='zh-Hant'],['en','English',config.language==='en']]);
}
function sheets(s){
  const sh=route.sheets.at(-1);
  if(!sh)return '';
  const r=s.all[sh.id],tx=r?.entries[sh.index];
  let title,body;
  switch(sh.type){
    case 'edit':title=r.cap===null?'设置预算':'调整预算';body=edit(r);break;
    case 'pick': title='选择预算分类';body=s.all.filter(r=>!r.archived).map(r=>`<button class="pickrow" data-act="edit" data-id="${r.id}"><span>${r.name}</span><small class="muted">${r.cap===null?'设预算':money(r.cap)}</small></button>`).join('');break;
    case 'months':title='选择月份';body=`<form id="monthForm"><label class="field">年月<input name="month" required type="month" value="${Math.floor(route.month/12)}-${String(route.month%12+1).padStart(2,'0')}"></label><button class="primary">查看月份</button></form>`;break;
    case 'tools':title='原型设置';body=`<div class="controls">${ctl()}</div>`;break;
    case 'all-tx':title='全部贡献流水';body=transactions(r,true);break;
    case 'transaction':title=tx.kind==='pending'?'编辑待入账账单':'编辑已入账交易';body=`<form id="txForm" data-id="${r.id}" data-index="${sh.index}"><p class="hint">${r.name} · ${monthLabel(route.month)}${tx.day}日</p><label class="field">描述<input name="title" required value="${safe(tx.title)}"></label><label class="field">金额（¥）<input name="amount" type="number" step=".01" min=".01" required value="${tx.amount/100}"></label><button class="primary">保存修改</button></form>`;break;
    case 'delete-budget':
      title='删除分类预算';
      body=`<form id="deleteBudgetForm" data-id="${r.id}"><p>${r.name} · ${monthLabel(route.month)} · ${money(r.cap)}</p><p class="hint">仅移除预算额度，分类和流水会保留。</p><label class="field">生效范围<select name="scope"><option value="single">仅本月</option><option value="future">本月及以后</option></select></label><div class="between"><button type="button" class="pill" data-act="back">取消</button><button class="primary danger">确认删除</button></div></form>`;
      break;
    case 'confirm':title='确认预算变更';body=`<p>${monthLabel(route.month)} · ${r.name} · ${sh.cap===null?'移除预算':money(sh.cap)} · ${sh.to===null?'本月及以后':'仅本月'}</p><button data-act="confirm" class="primary">确认保存</button>`;break;
  }
  return `<div class="overlay"><section role="dialog" aria-modal="true" aria-label="${title}" class="sheet"><header class="sheetheader between"><h2>${title}</h2><button class="icbtn" data-act="back" aria-label="关闭">${icon('close')}</button></header><div class="sheetbody">${body}</div></section></div>`;
}
function iconButton(action,symbol,label,extra=''){return `<button class="icbtn ${extra}" data-act="${action}" aria-label="${label}" title="${label}">${icon(symbol)}</button>`}
function viewKey(){return [config.scenario,route.month,route.page,route.categoryId].join('/')}
function sheetKey(){return viewKey()+JSON.stringify(route.sheets)}
function remember(){
  scrolls.set(viewKey(),$('content').scrollTop);
  const body=document.querySelector('.sheetbody');if(body)scrolls.set(sheetKey(),body.scrollTop);
}
function render(){
  const s=summary(),sh=route.sheets.at(-1),isHome=route.page==='home';
  const category=route.page==='category'?s.all[route.categoryId]:null;
  const title=category?category.name:'月度复盘与趋势';
  const backLabel=category&&route.from==='review'?'返回月度复盘':'返回预算首页';
  document.documentElement.classList.toggle('dark',config.dark);
  $('phone').dataset.variant=config.variant;
  $('brand').innerHTML=icon('leaf')+' Accounted For';
  $('top').innerHTML=isHome?`<div class="monthnav">${iconButton('prev','left','上个月')}<button class="monthbutton" data-act="months">${monthLabel(route.month)} ${icon('down')}</button>${iconButton('next','right','下个月')}</div>${iconButton('pick','plus','设置分类预算','add')}`:`<div class="headrow">${iconButton('back','back',backLabel)}<strong class="pagetitle">${safe(title)}</strong></div>${category?categoryActions(category):''}`;
  $('content').innerHTML=isHome?homePage(s):category?categoryPage(category):reviewPage(s);
  $('nav').style.display=isHome?'flex':'none';
  $('nav').innerHTML=[['book','账本'],['wallet','预算'],['more','更多']].map(([key,l],i)=>`<span class="${i===1?'active':''}"><i>${icon(key)}</i>${l}</span>`).join('');
  $('layer').innerHTML=sheets(s);
  for(const id of ['content','nav','top'])$(id).inert=Boolean(sh);
  $('desktopControls').innerHTML=ctl();
  const level=sh?({'delete-budget':'删除分类预算',edit:'预算编辑',transaction:'流水编辑',pick:'分类选择',months:'选择月份',tools:'原型设置','all-tx':'全部流水',confirm:'确认预算'})[sh.type]:isHome?'L1 预算首页':category?'L3 分类详情页':'L2 完整复盘页';
  $('state').textContent=`${monthLabel(route.month)} · ${level} · CNY`;
  $('switcher').innerHTML=`${iconButton('variant-prev','left','上个方案')}<b>${config.variant} · ${variants[config.variant]}</b>${iconButton('variant-next','right','下个方案')}${iconButton('tools','tools','原型设置','settings')}`;
  const body=document.querySelector('.sheetbody');
  localizePhone();
  $('content').scrollTop=scrolls.get(viewKey())??0;
  if(body)body.scrollTop=scrolls.get(sheetKey())??0;
}
function pageUrl(r){
  const u=new URL(location.href),page=r.page==='category'?`budget/category/${r.categoryId}`:r.page==='review'?'budget/review':'budget';
  if(u.protocol==='file:')u.hash=page+'?variant='+config.variant;
  else{u.searchParams.set('variant',config.variant);u.hash=page}
  return u;
}
function move(r,push=true){
  remember();if(push)history.pushState(r,'',pageUrl(r));else history.replaceState(r,'',pageUrl(r));
  route=r;render();
  if(route.sheets.length)document.querySelector('.sheetheader button')?.focus({preventScroll:true});
}
function openSheet(type,id,index,extra={}){move({...route,sheets:[...route.sheets,{type,id,index,...extra}]})}
function back(){if(route.sheets.length||route.page!=='home')history.back()}
window.addEventListener('popstate',e=>{remember();route=e.state?.page?e.state:home(TODAY);history.replaceState(route,'',pageUrl(route));render()});
function flip(step){
  remember();config.variant='ABC'[('ABC'.indexOf(config.variant)+step+3)%3];history.replaceState(route,'',pageUrl(route));render();
}
function toast(msg){
  document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const node=document.createElement('div');
  node.className='toast';node.setAttribute('role','status');node.textContent=translate(msg);$('phone').append(node);
  toastTimer=setTimeout(()=>node.remove(),1500);
}
function saveCap(id,cap,to){
  const m=route.month;
  if(to===null)caps=caps.filter(c=>!(c.id===id&&c.scenario===config.scenario&&c.from>m));
  caps.push({scenario:config.scenario,id,cap,from:m,to});
  const last=route.sheets.at(-1);
  history.go(last.type==='confirm'?-2:-1);
  toast(cap===null?'已删除预算':'已更新预算');
}
function requestCap(id,cap){
  const to=$('budgetForm').elements.scope.value==='single'?route.month:null;
  if(mode()==='review'||cap===null||to===null)openSheet('confirm',id,undefined,{cap,to});
  else saveCap(id,cap,to);
}
document.addEventListener('click',e=>{
  const menu=document.querySelector('.category-actions[open]');
  if(menu&&!menu.contains(e.target))menu.open=false;
  if(e.target.classList.contains('overlay')){back();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id===undefined?undefined:Number(b.dataset.id);
  switch(a){
    case 'variant-prev':flip(-1);break;case 'variant-next':flip(1);break;
    case 'prev':case 'next':move(home(route.month+(a==='prev'?-1:1)),false);break;
    case 'past':case 'today':case 'future':move(home(TODAY+({past:-1,today:0,future:1})[a]),false);break;
    case 'light':case 'dark':remember();config.dark=a==='dark';render();break;
    case 'en':case 'zh-Hant':case 'zh-Hans':remember();config.language=a;render();break;
    case 'regular':case 'new':case 'blank':config.scenario=a;move(home(TODAY),false);break;
    case 'review':move({...route,page:'review',sheets:[]});break;
    case 'detail':move({page:'category',categoryId:id,from:route.page,month:route.month,sheets:[]});break;
    case 'back':back();break;
    case 'tools':if(route.sheets.at(-1)?.type==='tools')back();else openSheet('tools');break;
    case 'pick':case 'months':case 'edit':case 'delete-budget':case 'all-tx':case 'transaction':openSheet(a,id,Number(b.dataset.index));break;
    case 'fill':$('budgetForm').elements.amount.value=b.dataset.value;break;
    case 'clear':requestCap(id,null);break;
    case 'confirm':{const sh=route.sheets.at(-1);saveCap(sh.id,sh.cap,sh.to);break}
    case 'save-note':{
      const area=b.closest('.note').querySelector('textarea');
      if(Array.from(area.value.trim()).length>500)return;
      notes[area.dataset.note]=area.value.trim();delete drafts[area.dataset.note];remember();render();toast('备忘已保存');break;
    }
  }
});
document.addEventListener('input',e=>{
  if(!e.target.matches('[data-note]'))return;
  const el=e.target,panel=el.closest('.note'),n=Array.from(el.value).length;
  drafts[el.dataset.note]=el.value;panel.querySelector('[data-count]').textContent=`${n} / 500`;
  panel.querySelector('button').disabled=n>500;
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,id=Number(f.dataset.id);
  if(f.id==='monthForm'){const [yr,mo]=f.elements.month.value.split('-').map(Number);const m=12*yr+mo-1;
    window.addEventListener('popstate',()=>move(home(m),false),{once:true});back();return}
  if(f.id==='deleteBudgetForm'){saveCap(id,null,f.elements.scope.value==='single'?route.month:null);return}
  const amount=Math.round(Number(f.elements.amount.value)*100);
  if(!Number.isSafeInteger(amount)||amount<=0)return;
  if(f.id==='budgetForm'){requestCap(id,amount);return}
  if(f.id==='txForm'){const t=txs(id,route.month)[Number(f.dataset.index)];t.title=f.elements.title.value;t.amount=amount;back();toast('已保存修改')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const menu=document.querySelector('.category-actions[open]');
    if(menu){menu.open=false;menu.querySelector('summary').focus();return}
    back();return;
  }
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();flip(e.key==='ArrowLeft'?-1:1)}
});
let touchStart;
$('content').addEventListener('touchstart',e=>{touchStart=e.touches[0]},{passive:true});
$('content').addEventListener('touchend',e=>{
  if(!touchStart||route.page!=='home'||route.sheets.length)return;
  const p=e.changedTouches[0],dx=p.clientX-touchStart.clientX,dy=p.clientY-touchStart.clientY;
  if(Math.abs(dx)>72&&Math.abs(dx)>Math.abs(dy)*1.7)move(home(route.month+(dx<0?1:-1)),false);
},{passive:true});

const englishKeys=Object.keys(englishLabels).sort((a,b)=>b.length-a.length);
const words=new RegExp(englishKeys.join('|'),'g');
const monthsEN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function translate(text){
  if(config.language==='zh-Hans')return text;
  if(config.language==='zh-Hant')return text.replace(/[\u3400-\u9fff]/g,c=>traditional[c]??c);
  return text.replace(/(\d+)年(\d+)月/g,(_,yr,m)=>`${monthsEN[Number(m)-1]} ${yr}`)
    .replace(/(\d+)月(\d+)日/g,(_,m,d)=>`${monthsEN[Number(m)-1]} ${d}`)
    .replace(/(\d+)月/g,(_,m)=>monthsEN[Number(m)-1])
    .replace(words,key=>englishLabels[key]).replaceAll('，',', ');
}
function localizePhone(){
  const phone=$('phone');phone.lang=config.language;
  if(config.language==='zh-Hans')return;
  const nodes=document.createTreeWalker(phone,NodeFilter.SHOW_TEXT);
  const list=[];while(nodes.nextNode())list.push(nodes.currentNode);
  for(const node of list){
    if(node.parentElement.closest('textarea,.controls,[data-literal],.toast'))continue;
    node.textContent=translate(node.textContent);
  }
  for(const el of phone.querySelectorAll('[aria-label],[title],[placeholder]')){
    if(el.closest('.controls'))continue;
    for(const key of ['aria-label','title','placeholder'])if(el.hasAttribute(key))el.setAttribute(key,translate(el.getAttribute(key)));
  }
}
